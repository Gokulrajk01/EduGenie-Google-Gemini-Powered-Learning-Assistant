<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - AI Learning Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>EduGenie</h1>
            <p>Google Gemini Powered Learning Assistant</p>
        </section>

        <section class="card">
            <label for="task">Choose a task</label>
            <select id="task">
                <option value="explain">Explain</option>
                <option value="qa">Q&amp;A</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize</option>
                <option value="learn">Recommend Learning Path</option>
            </select>

            <label for="inputText">Enter your topic, question, or text</label>
            <textarea id="inputText" rows="10"
                placeholder="Example: Explain the Pythagoras theorem in simple terms."></textarea>

            <button id="submitBtn" onclick="runTask()">Submit</button>

            <div id="status"></div>
            <div id="result" class="result"></div>
        </section>
    </main>

    <script>
        async function runTask() {
            const task = document.getElementById("task").value;
            const text = document.getElementById("inputText").value.trim();
            const result = document.getElementById("result");
            const status = document.getElementById("status");

            if (!text) {
                result.textContent = "Please enter some text.";
                return;
            }

            status.textContent = "EduGenie is thinking...";
            result.textContent = "";

            const endpoints = {
                explain: "/explain",
                qa: "/qa",
                quiz: "/quiz",
                summarize: "/summarize",
                learn: "/learn/recommendations"
            };

            try {
                const response = await fetch(endpoints[task], {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({text})
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Request failed");
                }

                if (task === "quiz" && Array.isArray(data.result)) {
                    result.innerHTML = data.result.map((q, i) => `
                        <div class="quiz-question">
                            <h3>${i + 1}. ${escapeHtml(q.question)}</h3>
                            <ul>
                                ${q.options.map(option =>
                                    `<li>${escapeHtml(option)}</li>`
                                ).join("")}
                            </ul>
                            <strong>Answer: ${escapeHtml(q.answer)}</strong>
                        </div>
                    `).join("");
                } else {
                    result.textContent = typeof data.result === "string"
                        ? data.result
                        : JSON.stringify(data.result, null, 2);
                }
            } catch (error) {
                result.textContent = "Error: " + error.message;
            } finally {
                status.textContent = "";
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
</body>
</html>
